services:
  postgres:
    # pgvector/pgvector is a drop-in build of the official postgres image
    # with the pgvector extension compiled in — needed for services/
    # ai-platform's embedding similarity search (`create extension vector;`
    # in its migration). Every other service is unaffected; this is not a
    # behavioral change for them.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eos
      POSTGRES_PASSWORD: eos_dev_password
      POSTGRES_DB: eos
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      # Creates the eos_app runtime role + one database per microservice on
      # first boot only (docker-entrypoint-initdb.d convention — re-run by
      # wiping the pgdata volume, not by editing this file after first start).
      - "./postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]

  redpanda:
    image: redpandadata/redpanda:v24.1.9
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["${REDPANDA_HOST_PORT:-9092}:9092"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports: ["${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123", "${CLICKHOUSE_NATIVE_HOST_PORT:-9004}:9000"]
    volumes: ["chdata:/var/lib/clickhouse"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eos_admin
      MINIO_ROOT_PASSWORD: eos_dev_password
    ports: ["${MINIO_API_HOST_PORT:-9002}:9000", "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  chdata:
  miniodata:
